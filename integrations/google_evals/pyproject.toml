# integrations.google_evals — versioned report adapter for the pinned
# `webmcp-evals` JSON reporter (core Tier 2; spec §12.10, §24.7, §25.3).
# Import/normalize/correlate ONLY — never reimplement the evaluator (LD-12).
[project]
name = "actionwitness-integration-google-evals"
version = "0.1.0"
description = "webmcp-evals report import, normalization, and trial correlation adapter"
requires-python = ">=3.12"
license = "Apache-2.0"
# `httpx` is declared because `generation.py` imports it (constitution §1: every
# dependency declared by its importing package). It is the project's existing
# client, not a new admission — a vendor SDK for one POST would be an undeclared
# runtime dependency needing operator approval.
dependencies = ["actionwitness-core", "httpx>=0.27"]

[tool.uv.sources]
actionwitness-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrations"]
