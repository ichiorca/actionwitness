# integrations.self_target — ActionWitness as its own target (§12.20, FR-171).
#
# Drives and observes the harness through its PUBLIC versioned HTTP API
# (/api/v1), exactly as a third-party integration would. It imports no
# application module and holds no in-process handle: FR-171 says a built-in
# target "shall not receive privileged access unavailable to a third-party
# adapter", and the cheapest way to keep that true is to make it impossible —
# this distribution depends on the core and an HTTP client, and nothing else.
#
# Named `self_target` rather than `self` because `self` is a Python keyword and
# `integrations.self` is not an importable path. The *target id* is `self`; only
# the module name differs.
[project]
name = "actionwitness-integration-self-target"
version = "0.1.0"
description = "ManagedTargetAdapter + ObservationProvider that treat ActionWitness as its own target"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["actionwitness-core", "httpx>=0.27"]

[tool.uv.sources]
actionwitness-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrations"]
