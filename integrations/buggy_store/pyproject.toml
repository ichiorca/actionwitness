# integrations.buggy_store — translates between actionwitness_core.ports and the
# Buggy Store's PUBLIC versioned HTTP API (/demo/api/v1). Never imports demo
# service objects directly (spec §26.7, LD-8/14).
# Layout note: spec §18 sketches flat modules; a src/ namespace-package layout is
# used so the normative import path `integrations.buggy_store` (§26.7) installs
# cleanly — an allowed path adjustment per §18's closing note.
[project]
name = "actionwitness-integration-buggy-store"
version = "0.1.0"
description = "ManagedTargetAdapter + ObservationProvider for the Buggy Store example app"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["actionwitness-core", "httpx>=0.27"]

[tool.uv.sources]
actionwitness-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrations"]
