# Buggy Store — independently runnable deterministic demo target (spec §18, LD-6/14).
# NORMATIVE: builds and runs with actionwitness_core ABSENT (§26.7). It intentionally
# depends on nothing from the assurance stack; tests/architecture enforces this.
[project]
name = "buggy-store"
version = "0.1.0"
description = "Deterministic commerce demo application with injectable failure profiles"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    # The store's own async SQLite driver (BUILD_ORDER §7/M2: "add its own async
    # SQLite dependency without introducing an assurance dependency"). Declared
    # here rather than inherited from the workspace, because §26.7 requires this
    # distribution to install and run on its own.
    "aiosqlite>=0.20",
]

[project.scripts]
buggy-store = "buggy_store.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buggy_store"]
