# actionwitness_service — application/composition layer (spec v1.9 §18).
# Owns FastAPI, persistence (aiosqlite), orchestration, guidance, adapter registry,
# telemetry, and the CLI. Depends on actionwitness_core; demo access goes ONLY through
# the registered adapter and Buggy Store's versioned HTTP API (LD-8/14).
[project]
name = "actionwitness-service"
version = "0.1.0"
description = "ActionWitness — application and API layer"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "actionwitness-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Pinned exactly (dependency-policy: pin versions, avoid floating ranges).
    # The only async SQLite driver in the workspace, and it lives in the SERVICE
    # package alone: the constitution keeps `actionwitness_core` free of aiosqlite,
    # and `tests/architecture` fails if the core grows an import of it. Chosen over
    # hand-rolling a thread-pool wrapper around stdlib `sqlite3` because ADR-0003's
    # busy-timeout and BEGIN IMMEDIATE semantics need the driver to preserve
    # per-connection state across awaits, which a naive executor wrapper does not.
    # Small, single-module, no transitive dependencies, actively maintained.
    "aiosqlite==0.22.1",
    "pydantic>=2.9",
    # Declared, not inherited. Both arrive transitively today — httpx through the
    # buggy-store integration, starlette through FastAPI — and the service imports
    # each one directly: `api/app.py` owns the lifespan HTTPX client (ADR-0001) and
    # `api/middleware.py` subclasses Starlette's BaseHTTPMiddleware. An import that
    # only resolves because some other distribution happened to pull it in breaks the
    # moment that distribution is not installed, which is exactly what §29.1's
    # "install ... as separate distributions" does in the image.
    "httpx>=0.27",
    "starlette>=0.40",
]

[project.scripts]
actionwitness = "actionwitness_service.cli:main"

[tool.uv.sources]
actionwitness-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actionwitness_service"]
