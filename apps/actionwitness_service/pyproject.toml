# actionwitness_service — application/composition layer (spec v1.9 §18).
# Owns FastAPI, persistence (aiosqlite), orchestration, guidance, adapter registry,
# telemetry, and the CLI. Depends on actionwitness_core; demo access goes ONLY through
# the registered adapter and Buggy Store's versioned HTTP API (LD-8/14).
[project]
name = "actionwitness-service"
version = "0.1.0"
description = "ActionWitness — application and API layer"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "actionwitness-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
]

[project.scripts]
actionwitness = "actionwitness_service.cli:main"

[tool.uv.sources]
actionwitness-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actionwitness_service"]
