<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">ActionWitness catches a false-success WebMCP action</title>
  <desc id="desc">The tool reports success, but independent observation finds the cart total unchanged and the outcome fails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#1c2430"/>
    </linearGradient>
    <clipPath id="leftShot"><rect x="56" y="220" width="620" height="418" rx="15"/></clipPath>
    <clipPath id="rightShot"><rect x="764" y="220" width="620" height="418" rx="15"/></clipPath>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="720" y="78" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="760">One journey. Two sources of truth.</text>
  <text x="720" y="124" text-anchor="middle" fill="#99a3b1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">The response is evidence. The observed business state decides the verdict.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="48" y="166" width="636" height="522" rx="22" fill="#1c222c" stroke="#55c283" stroke-width="2"/>
    <rect x="72" y="184" width="174" height="38" rx="19" fill="#17301f"/>
    <text x="159" y="209" text-anchor="middle" fill="#7edaa3" font-size="15" font-weight="800" letter-spacing="1">TOOL REPORT</text>
    <text x="648" y="210" text-anchor="end" fill="#55c283" font-size="22" font-weight="800">SUCCESS</text>
    <image href="../screenshots/layered-failure-timeline.png" x="56" y="220" width="620" height="418" preserveAspectRatio="xMaxYMid slice" clip-path="url(#leftShot)"/>
    <text x="72" y="668" fill="#cbd2dc" font-size="18">apply_discount reported success</text>

    <rect x="756" y="166" width="636" height="522" rx="22" fill="#1c222c" stroke="#ec7f77" stroke-width="2"/>
    <rect x="780" y="184" width="236" height="38" rx="19" fill="#3a1a18"/>
    <text x="898" y="209" text-anchor="middle" fill="#ffaaa4" font-size="15" font-weight="800" letter-spacing="1">INDEPENDENT VERDICT</text>
    <text x="1356" y="210" text-anchor="end" fill="#ec7f77" font-size="22" font-weight="800">FAILED</text>
    <image href="../screenshots/layered-failure-verdict.png" x="764" y="220" width="620" height="418" preserveAspectRatio="xMinYMid slice" clip-path="url(#rightShot)"/>
    <text x="780" y="668" fill="#cbd2dc" font-size="18">Expected $20.00 · observed $25.00</text>
  </g>
  <path d="M704 396h32" stroke="#8ca0f0" stroke-width="5" stroke-linecap="round"/>
  <path d="m727 383 13 13-13 13" fill="none" stroke="#8ca0f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="421" y="726" width="598" height="48" rx="24" fill="#251c25" stroke="#b3312e"/>
  <text x="720" y="757" text-anchor="middle" fill="#ffb5b0" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="18">false_success_or_state_mismatch</text>
</svg>
