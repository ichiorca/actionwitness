# actionwitness_core — reusable, target-neutral assurance library (spec v1.8 §18, LD-2/LD-7).
# NORMATIVE: this package must install and test on its own (spec §26.7) and must never
# import FastAPI, frontend assets, an integration, a demo application, an evaluator
# vendor, or a commerce-domain module. tests/architecture enforces this in CI.
[project]
name = "actionwitness-core"
version = "0.1.0"
description = "Target-neutral outcome-assurance core: contracts, engine, evidence, evals, benchmarks, reports, ports"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actionwitness_core"]
